<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma2Tech | System Repair</title>
    <style>
        body {
            background: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Scanning effect (Tech feel) */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 204, 0.3);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid #00ffcc;
            background: rgba(0, 20, 20, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
        }

        h1 { margin-bottom: 10px; letter-spacing: 3px; }

        .status-box {
            margin: 30px 0;
        }

        /* Progress Bar Animation */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #111;
            border: 1px solid #00ffcc;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #00ffcc;
            width: 0%;
            animation: load 5s ease-in-out infinite;
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        p { color: #888; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div class="container">
        <h1>PHARMA2TECH</h1>
        <div class="status-box">
            <p>> SYSTEM OPTIMIZATION IN PROGRESS...</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
        <p>Engineers are currently repairing the database and enhancing performance.<br>Please stand by for system restoration.</p>
    </div>

</body>
</html>
